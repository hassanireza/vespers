<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a58bff"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="url(#bg2)" rx="16"/>
  <text x="450" y="34" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">Engine Class Hierarchy</text>

  <rect x="330" y="60" width="240" height="86" rx="12" fill="#101a33" stroke="#ffffff" stroke-width="1.5"/>
  <text x="450" y="84" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">GameEngine&lt;TState&gt;</text>
  <text x="450" y="104" fill="#9fb0d1" font-size="11" text-anchor="middle">abstract class</text>
  <text x="450" y="122" fill="#9fb0d1" font-size="10" text-anchor="middle">start() reset() stop()</text>
  <text x="450" y="136" fill="#9fb0d1" font-size="10" text-anchor="middle">subscribe() emit() destroy()</text>

  <line x1="180" y1="230" x2="450" y2="146" stroke="#a58bff" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="450" y1="230" x2="450" y2="146" stroke="#a58bff" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="720" y1="230" x2="450" y2="146" stroke="#a58bff" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="60" y="230" width="240" height="150" rx="12" fill="#0c1122" stroke="#67ffb7" stroke-width="1.5"/>
  <text x="180" y="256" fill="#67ffb7" font-size="13" font-weight="bold" text-anchor="middle">TetrisEngine</text>
  <text x="180" y="278" fill="#9fb0d1" font-size="10" text-anchor="middle">move() rotate()</text>
  <text x="180" y="294" fill="#9fb0d1" font-size="10" text-anchor="middle">softDrop() hardDrop()</text>
  <text x="180" y="310" fill="#9fb0d1" font-size="10" text-anchor="middle">holdPiece() togglePause()</text>
  <text x="180" y="330" fill="#e2e8f5" font-size="10" text-anchor="middle" font-style="italic">uses SoundManager</text>
  <text x="180" y="350" fill="#e2e8f5" font-size="10" text-anchor="middle" font-style="italic">7 tetromino defs</text>
  <text x="180" y="366" fill="#e2e8f5" font-size="10" text-anchor="middle" font-style="italic">level speed curve</text>

  <rect x="330" y="230" width="240" height="150" rx="12" fill="#0c1122" stroke="#7d67ff" stroke-width="1.5"/>
  <text x="450" y="256" fill="#a58bff" font-size="13" font-weight="bold" text-anchor="middle">TicTacToeEngine</text>
  <text x="450" y="278" fill="#9fb0d1" font-size="10" text-anchor="middle">playHumanMove()</text>
  <text x="450" y="294" fill="#9fb0d1" font-size="10" text-anchor="middle">setDifficulty()</text>
  <text x="450" y="310" fill="#9fb0d1" font-size="10" text-anchor="middle">minimax() private</text>
  <text x="450" y="330" fill="#e2e8f5" font-size="10" text-anchor="middle" font-style="italic">easy / normal /</text>
  <text x="450" y="346" fill="#e2e8f5" font-size="10" text-anchor="middle" font-style="italic">impossible tiers</text>
  <text x="450" y="366" fill="#e2e8f5" font-size="10" text-anchor="middle" font-style="italic">session scoreboard</text>

  <rect x="600" y="230" width="240" height="150" rx="12" fill="#0c1122" stroke="#59c3ff" stroke-width="1.5"/>
  <text x="720" y="256" fill="#59c3ff" font-size="13" font-weight="bold" text-anchor="middle">LifeEngine</text>
  <text x="720" y="278" fill="#9fb0d1" font-size="10" text-anchor="middle">toggleCell() randomize()</text>
  <text x="720" y="294" fill="#9fb0d1" font-size="10" text-anchor="middle">play() pause() setSpeed()</text>
  <text x="720" y="310" fill="#9fb0d1" font-size="10" text-anchor="middle">stampPattern()</text>
  <text x="720" y="330" fill="#e2e8f5" font-size="10" text-anchor="middle" font-style="italic">glider / pulsar /</text>
  <text x="720" y="346" fill="#e2e8f5" font-size="10" text-anchor="middle" font-style="italic">glider gun presets</text>
  <text x="720" y="366" fill="#e2e8f5" font-size="10" text-anchor="middle" font-style="italic">variable tick speed</text>
</svg>
